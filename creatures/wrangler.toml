# Cloudflare Pages settings for the Broodkeep game.
# This file is committed to git, so it must never hold secrets.
# Secrets go in .dev.vars (local) and the Cloudflare dashboard (live).

name = "broodkeep"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

# D1 database (cloud saves, docs/cloud-saves.md), created in the Cloudflare dashboard.
# A database id is not a secret.
[[d1_databases]]
binding = "DB"
database_name = "broodkeep"
database_id = "d7dd68cc-5111-48fb-8b3c-af3194162db1"
